[project]
name = "openalex-mcp"
version = "2.0.0"
description = "MCP stdio server for the OpenAlex API (global scholarly graph)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Christopher Gerteis", email = "christopher.gerteis@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "openalex",
    "scholarly-graph",
    "bibliometrics",
    "digital-humanities",
    "bibliographic-search",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.scripts]
openalex-mcp = "openalex_mcp:main"
openalex-mcp-ledger = "openalex_mcp.ledger:_cli"

[project.urls]
Homepage = "https://www.christophergerteis.net"
Repository = "https://github.com/ckgerteis/openalex-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout: the wheel contains the package and nothing else.
#
# The flat layout this replaces installed `server.py` and `ledger.py` as
# *top-level* modules. Any two servers of this family in one environment
# therefore overwrote each other, and `pip check` reported nothing wrong — the
# later install simply won, silently, and the survivor answered under the wrong
# server's name. Namespacing under a package is what lets them coexist.
[tool.hatch.build.targets.wheel]
packages = ["src/openalex_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/CHANGELOG.md",
    "/install.ps1",
    "/.env.example",
    "/response-schema.json",
    "/tests",
]
